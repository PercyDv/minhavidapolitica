<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | Painel MinhaVidaPolítica</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="cabecalho">
          <h1>Usuários</h1>
          <p>Quem pode entrar no painel. Administradores fazem tudo; editores cuidam dos dados, sem aprovar fontes nem gerir usuários.</p>
        </div>
        <section class="toolbar">
          <span class="grow"></span>
          <button class="btn btn-primario" id="btn-novo" type="button">Novo usuário</button>
        </section>
        <div class="tabela-wrap">
          <table class="tabela">
            <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Situação</th><th>Último acesso</th><th><span class="sr">Ações</span></th></tr></thead>
            <tbody id="corpo"></tbody>
          </table>
        </div>
        <dialog id="dlg">
          <form id="form">
            <div class="dlg-topo"><h2 id="dlg-titulo">Novo usuário</h2><p id="dlg-sub"></p></div>
            <div class="dlg-corpo">
              <div class="grid-2">
                <label class="field cheio"><span>Nome *</span><input type="text" name="nome" maxlength="120" required></label>
                <label class="field"><span>Login *</span><input type="text" name="username" maxlength="60" minlength="3" required autocomplete="off"></label>
                <label class="field"><span>Perfil *</span>
                  <select name="perfil" required><option value="EDITOR">Editor</option><option value="ADMIN">Administrador</option></select>
                </label>
                <label class="field cheio"><span id="rotulo-senha">Senha *</span><input type="password" name="senha" maxlength="72" autocomplete="new-password"><small id="dica-senha">Mínimo de 8 caracteres.</small></label>
                <label class="check cheio"><input type="checkbox" name="ativo" checked> Usuário ativo</label>
              </div>
            </div>
      <div class="aviso aviso-erro erro-form" id="erro-form" hidden></div>
      <div class="dlg-rodape">
        <button type="button" class="btn" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primario">Salvar usuário</button>
      </div>
          </form>
        </dialog>
      </main>
    </div>
  </div>
  <script type="module" src="js/usuarios.js"></script>
</body>
</html>
