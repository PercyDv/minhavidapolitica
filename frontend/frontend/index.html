<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Vida Política</title>
  <meta name="description" content="Informações oficiais sobre quem está no cargo e sobre quem concorreu nas eleições, por estado. Sem opinião e sem rótulos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23f2c14e%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-size=%2720%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27%2314213d%27%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>

  <header class="topo">
    <div class="topo-interno">
      <a class="logo" href="#/" aria-label="Minha Vida Política, página inicial"><mark>Minha</mark> VidaPolítica</a>
      <div class="seletor">
        <span id="rotulo-seletor">Seu estado</span>
        <button type="button" id="btn-estados" class="btn-estado" aria-haspopup="dialog" aria-describedby="rotulo-seletor">Escolher…</button>
      </div>
    </div>
  </header>

  <main id="conteudo" class="pagina" tabindex="-1">
    <p class="carregando">Carregando…</p>
  </main>

  <footer class="rodape">
    <p>A escolha do estado é manual: este site não usa a sua localização.</p>
    <p>Mostramos só dados de fontes oficiais aprovadas, sempre com a fonte e a data de atualização. Não há notas, rankings nem opinião.</p>
  </footer>

  <dialog id="dlg-estados" aria-labelledby="dlg-titulo">
    <h2 id="dlg-titulo">Escolha seu estado</h2>
    <div id="grade-uf" class="grade-uf"></div>
    <button type="button" id="btn-fechar" class="btn-link">Fechar</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
